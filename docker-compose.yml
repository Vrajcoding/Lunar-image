services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - lunar-net

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
    depends_on:
      - ml-service
    volumes:
      - shared-data:/data
    networks:
      - lunar-net

  ml-service:
    build: ./ml-service
    ports:
      - "${ML_SERVICE_PORT:-8001}:8001"
    volumes:
      - shared-data:/data
    networks:
      - lunar-net

volumes:
  shared-data:

networks:
  lunar-net:
    driver: bridge
