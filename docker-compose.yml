services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lunar-net

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
    depends_on:
      - ml-service
    volumes:
      - shared-data:/data
    networks:
      - lunar-net

  ml-service:
    build: ./ml-service
    ports:
      - "8001:8001"
    volumes:
      - shared-data:/data
    networks:
      - lunar-net

volumes:
  shared-data:

networks:
  lunar-net:
    driver: bridge
